name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        env:
          ECO_KEYSTORE_B64: ${{ secrets.ECO_KEYSTORE_B64 }}
          ECO_KS_PASS: ${{ secrets.ECO_KS_PASS }}
        run: |
          if [ -z "$ECO_KEYSTORE_B64" ] || [ -z "$ECO_KS_PASS" ]; then
            echo "::error::Faltam os Secrets ECO_KEYSTORE_B64 e ECO_KS_PASS (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          unzip -o IPTVPlayer.zip
          cd IPTVPlayer
          echo "$ECO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/eco.keystore"
          export ECO_KEYSTORE_FILE="$RUNNER_TEMP/eco.keystore"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Preparar APK e versão
        run: |
          cp IPTVPlayer/app/build/outputs/apk/release/app-release.apk eco_player.apk
          VC=$(grep -oP 'versionCode = \K[0-9]+' IPTVPlayer/app/build.gradle.kts)
          VN=$(grep -oP 'versionName = "\K[^"]+' IPTVPlayer/app/build.gradle.kts)
          echo "{\"versionCode\": $VC, \"versionName\": \"$VN\"}" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-apk
          path: eco_player.apk
      - name: Publicar para download direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: eco_player
          body: Última versão da app eco_player.
          files: |
            eco_player.apk
            version.json
          make_latest: true
