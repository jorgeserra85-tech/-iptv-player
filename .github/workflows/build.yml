name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          unzip -o IPTVPlayer.zip
          cd IPTVPlayer
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Preparar APK
        run: cp IPTVPlayer/app/build/outputs/apk/release/app-release.apk eco_player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-apk
          path: eco_player.apk
      - name: Publicar para download direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: eco_player
          body: Última versão da app eco_player.
          files: eco_player.apk
          make_latest: true
