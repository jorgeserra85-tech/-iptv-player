<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#121417; --card:#1E2126; --line:#2C3138; --accent:#3DDC97; --text:#ECEFF1; --muted:#8A939C; --danger:#FF6B6B; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  h1 { color:var(--accent); font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  label { display:block; color:var(--muted); font-size:13px; margin:10px 0 4px; }
  input[type=text], input[type=email], input[type=password], input[type=number] {
    width:100%; padding:12px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font-size:16px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { font-size:16px; padding:12px 16px; border-radius:8px; border:0; cursor:pointer; font-weight:600; }
  .primary { background:var(--accent); color:#0b1a12; width:100%; margin-top:14px; }
  .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .danger { background:transparent; color:var(--danger); border:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .prov-name { font-weight:700; font-size:17px; }
  .prov-url { color:var(--muted); font-size:13px; word-break:break-all; margin-top:2px; }
  .badge { font-size:12px; padding:3px 8px; border-radius:20px; white-space:nowrap; }
  .on { background:#1f3a2d; color:var(--accent); } .off { background:#3a2323; color:var(--danger); }
  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .actions button { flex:1; padding:10px; font-size:14px; }
  .msg { min-height:20px; color:var(--muted); font-size:14px; margin-top:10px; }
  .msg.err { color:var(--danger); }
  .switch { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--text); }
  .switch input { width:20px; height:20px; accent-color:var(--accent); }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
  .hidden { display:none !important; }
  .grow { display:flex; align-items:center; gap:6px; padding:8px; border:1px solid var(--line); border-radius:8px; margin-top:6px; background:var(--bg); }
  .grow.off { opacity:.5; }
  .grow .mv { width:38px; padding:8px 0; font-size:16px; background:transparent; color:var(--text); border:1px solid var(--line); }
  .grow input[type=text] { padding:8px; font-size:15px; }
  .grow .orig { color:var(--muted); font-size:11px; margin-top:2px; word-break:break-word; }
  .grow .vis { width:22px; height:22px; accent-color:var(--accent); flex:none; }
  .sticky { position:sticky; bottom:0; background:var(--bg); padding:10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Painel IPTV</h1>
  <div class="sub" id="who">Gestão de servidores da app</div>

  <!-- Login -->
  <div id="loginView" class="card hidden">
    <label>Email</label>
    <input id="email" type="email" autocomplete="username">
    <label>Palavra-passe</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="primary" id="loginBtn">Entrar</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- Painel -->
  <div id="appView" class="hidden">
    <div class="card" id="formCard">
      <div class="prov-name" id="formTitle">Adicionar servidor</div>
      <label>Nome que o cliente vê na app</label>
      <input id="fName" type="text" placeholder="ex.: Servidor 1">
      <label>Endereço (Xtream)</label>
      <input id="fUrl" type="text" placeholder="ex.: http://servidor.com:8080" autocapitalize="off" autocorrect="off">
      <label>Ordem na lista (número menor aparece primeiro)</label>
      <input id="fPos" type="number" value="0">
      <div class="switch"><input id="fActive" type="checkbox" checked> <span>Visível na app</span></div>
      <button class="primary" id="saveBtn">Guardar</button>
      <button class="ghost hidden" id="cancelBtn" style="width:100%;margin-top:8px">Cancelar edição</button>
      <div class="msg" id="formMsg"></div>
    </div>

    <div id="list"></div>

    <!-- Grupos de um servidor -->
    <div id="groupsView" class="hidden">
      <div class="card">
        <div class="top">
          <div><div class="prov-name" id="gTitle">Grupos</div>
          <div class="prov-url">Use ▲▼ para ordenar. Desmarque o quadrado para esconder. Escreva um nome novo se quiser mudar o nome do grupo.</div></div>
        </div>
        <button class="ghost" id="gBack" style="width:100%;margin-top:12px">‹ Voltar aos servidores</button>
      </div>
      <div id="gList"></div>
      <div class="sticky">
        <button class="primary" id="gSave" style="margin-top:0">Guardar alterações</button>
        <div class="msg" id="gMsg"></div>
      </div>
    </div>
    <button class="ghost" id="logoutBtn" style="width:100%;margin-top:12px">Sair do painel</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lintzyocyzkdxjjllhoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_CP8imQ0ag4fmSl8NkKKvgQ_ck7Rt5hB";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let editingId = null;

function msg(el, text, err = false) { el.textContent = text; el.classList.toggle("err", err); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

async function refreshView() {
  const { data: { session } } = await db.auth.getSession();
  $("loginView").classList.toggle("hidden", !!session);
  $("appView").classList.toggle("hidden", !session);
  $("who").textContent = session ? "Sessão: " + session.user.email : "Gestão de servidores da app";
  if (session) loadList();
}

$("loginBtn").onclick = async () => {
  msg($("loginMsg"), "A entrar…");
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) return msg($("loginMsg"), "Email ou palavra-passe errados", true);
  msg($("loginMsg"), ""); refreshView();
};
$("password").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = async () => { await db.auth.signOut(); refreshView(); };

async function loadList() {
  const { data, error } = await db.from("providers").select("*").order("position").order("name");
  const list = $("list");
  if (error) { list.innerHTML = `<div class="card msg err">Erro: ${esc(error.message)}</div>`; return; }
  if (!data.length) { list.innerHTML = `<div class="empty">Ainda não há servidores. Adiciona o primeiro acima.</div>`; return; }
  list.innerHTML = data.map(p => `
    <div class="card">
      <div class="top">
        <div>
          <div class="prov-name">${esc(p.name)}</div>
          <div class="prov-url">${esc(p.server_url)}</div>
        </div>
        <span class="badge ${p.active ? "on" : "off"}">${p.active ? "Visível" : "Escondido"}</span>
      </div>
      <div class="actions">
        <button class="ghost" data-groups="${p.id}" data-name="${esc(p.name)}">Grupos</button>
        <button class="ghost" data-edit="${p.id}">Editar</button>
        <button class="ghost" data-toggle="${p.id}" data-active="${p.active}">${p.active ? "Esconder" : "Mostrar"}</button>
        <button class="danger" data-del="${p.id}" data-name="${esc(p.name)}">Apagar</button>
      </div>
    </div>`).join("");
  list.querySelectorAll("[data-groups]").forEach(b => b.onclick = () => openGroups(b.dataset.groups, b.dataset.name));
  list.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => startEdit(data.find(p => p.id == b.dataset.edit)));
  list.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
    const { error } = await db.from("providers").update({ active: b.dataset.active !== "true" }).eq("id", b.dataset.toggle);
    if (error) alert("Erro: " + error.message); loadList();
  });
  list.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(`Apagar "${b.dataset.name}"? Os clientes deixam de o ver na app.`)) return;
    const { error } = await db.from("providers").delete().eq("id", b.dataset.del);
    if (error) alert("Erro: " + error.message); loadList();
  });
}

function startEdit(p) {
  editingId = p.id;
  $("formTitle").textContent = "Editar " + p.name;
  $("fName").value = p.name; $("fUrl").value = p.server_url; $("fPos").value = p.position; $("fActive").checked = p.active;
  $("cancelBtn").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function resetForm() {
  editingId = null;
  $("formTitle").textContent = "Adicionar servidor";
  $("fName").value = ""; $("fUrl").value = ""; $("fPos").value = 0; $("fActive").checked = true;
  $("cancelBtn").classList.add("hidden");
}
$("cancelBtn").onclick = () => { resetForm(); msg($("formMsg"), ""); };

$("saveBtn").onclick = async () => {
  let url = $("fUrl").value.trim().replace(/\/+$/, "");
  const name = $("fName").value.trim();
  if (!name || !url) return msg($("formMsg"), "Preenche o nome e o endereço", true);
  if (!/^https?:\/\//i.test(url)) url = "http://" + url;
  const row = { name, server_url: url, position: parseInt($("fPos").value) || 0, active: $("fActive").checked };
  const q = editingId ? db.from("providers").update(row).eq("id", editingId) : db.from("providers").insert(row);
  const { error } = await q;
  if (error) return msg($("formMsg"), "Erro: " + error.message, true);
  msg($("formMsg"), editingId ? "Alterações guardadas ✓" : "Servidor adicionado ✓");
  resetForm(); loadList();
};

// ---------- Organizar grupos ----------
let gRows = [], gProv = null;

function showMain(show) {
  $("formCard").classList.toggle("hidden", !show);
  $("list").classList.toggle("hidden", !show);
  $("logoutBtn").classList.toggle("hidden", !show);
  $("groupsView").classList.toggle("hidden", show);
}

async function openGroups(id, name) {
  gProv = id; $("gTitle").textContent = "Grupos de " + name; msg($("gMsg"), "");
  showMain(false); window.scrollTo({ top: 0 });
  $("gList").innerHTML = `<div class="empty">A carregar…</div>`;
  const { data, error } = await db.from("group_settings").select("*").eq("provider_id", id).order("position").order("id");
  if (error) { $("gList").innerHTML = `<div class="card msg err">Erro: ${esc(error.message)}</div>`; return; }
  gRows = data;
  renderGroups();
}

function renderGroups() {
  if (!gRows.length) {
    $("gList").innerHTML = `<div class="empty">Ainda não há grupos.<br>Os grupos aparecem aqui depois de alguém entrar na app com este servidor.</div>`;
    return;
  }
  $("gList").innerHTML = gRows.map((g, i) => `
    <div class="grow ${g.hidden ? "off" : ""}">
      <input class="vis" type="checkbox" data-vis="${i}" ${g.hidden ? "" : "checked"} title="Visível na app">
      <div style="flex:1;min-width:0">
        <input type="text" data-ren="${i}" value="${esc(g.rename || "")}" placeholder="${esc(g.name)}">
        ${g.rename ? `<div class="orig">Original: ${esc(g.name)}</div>` : ""}
      </div>
      <button class="mv" data-up="${i}" ${i === 0 ? "disabled" : ""}>▲</button>
      <button class="mv" data-down="${i}" ${i === gRows.length - 1 ? "disabled" : ""}>▼</button>
    </div>`).join("");
  const L = $("gList");
  L.querySelectorAll("[data-vis]").forEach(c => c.onchange = () => { gRows[c.dataset.vis].hidden = !c.checked; c.closest(".grow").classList.toggle("off", !c.checked); });
  L.querySelectorAll("[data-ren]").forEach(t => t.oninput = () => { gRows[t.dataset.ren].rename = t.value.trim() || null; });
  L.querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(+b.dataset.up, -1));
  L.querySelectorAll("[data-down]").forEach(b => b.onclick = () => move(+b.dataset.down, 1));
}

function move(i, d) {
  const j = i + d; if (j < 0 || j >= gRows.length) return;
  [gRows[i], gRows[j]] = [gRows[j], gRows[i]];
  renderGroups();
  const btn = $("gList").querySelector(`[data-${d < 0 ? "up" : "down"}="${j}"]`);
  if (btn && !btn.disabled) btn.focus();
}

$("gBack").onclick = () => { showMain(true); loadList(); };
$("gSave").onclick = async () => {
  if (!gRows.length) return;
  msg($("gMsg"), "A guardar…");
  const rows = gRows.map((g, i) => ({ provider_id: g.provider_id, name: g.name, position: i, hidden: !!g.hidden, rename: g.rename || null }));
  const { error } = await db.from("group_settings").upsert(rows, { onConflict: "provider_id,name" });
  if (error) return msg($("gMsg"), "Erro: " + error.message, true);
  msg($("gMsg"), "Guardado ✓ Os clientes veem as alterações na próxima vez que entrarem.");
};

refreshView();
</script>
</body>
</html>
